name: Vercel Deployment Checks

# GitHub runs repository_dispatch workflows from the default branch only.
# This file will not run until it is merged to main.
on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      # Official status action: main step marks pending, post step reports
      # job status automatically. `state` is not an action input.
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel Deployment Checks | ${{ github.event.client_payload.project.name }} (${{ github.event.client_payload.environment }})"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: sports-card-enhancer/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sports-card-enhancer/app
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: sports-card-enhancer/app
        run: pnpm lint

      # `pnpm build` includes `tsc -b`.
      - name: Build
        working-directory: sports-card-enhancer/app
        run: pnpm build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff
        run: |
          ruff check backend
          ruff check sports-card-enhancer
